<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="Uved.kz — подключение WhatsApp-номеров, база контактов и запуск WhatsApp-рассылок."
    />
    <title>WhatsApp-номера · Uved.kz</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <aside id="sidebar" class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#campaigns"
        ><img src="/favicon.svg" alt="" width="24" height="24" /><span
          >Uved<span class="brand-period">.kz</span></span
        ></a
      >
      <div class="nav-label">Управление</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <button class="profile" id="profile">
          <span class="avatar">АД</span
          ><span><strong>Мой аккаунт</strong><small>Выйти</small></span
          ><span data-icon="chevrons"></span>
        </button>
      </div>
    </aside>
    <div class="mobile-scrim" id="scrim"></div>
    <div class="shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            id="mobile-menu"
            aria-label="Открыть меню"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <span data-icon="menu"></span></button
          ><span>Рабочее пространство</span
          ><span class="breadcrumb-slash">/</span
          ><strong id="breadcrumb-page">Рассылки</strong>
        </div>
        <div class="topbar-actions">
          <button class="small-avatar" id="account" aria-label="Мой аккаунт">
            АД
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>Uved.kz · WhatsApp-рассылки</span
        ><span><i class="status-dot"></i>Автообновление каждые 10 секунд</span>
      </footer>
    </div>
    <div class="login" id="login" hidden>
      <form class="login-card" id="login-form">
        <a class="brand" href="#campaigns"
          ><img src="/favicon.svg" alt="" width="24" height="24" /><span
            >Uved<span class="brand-period">.kz</span></span
          ></a
        >
        <h1>Вход в Uved.kz</h1>
        <p>Номера, база контактов и рассылки в WhatsApp</p>
        <div class="field">
          <label for="login-name">Логин</label>
          <input
            id="login-name"
            name="login"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          />
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="error-text" id="login-error" role="alert"></div>
        <button type="submit" class="button primary">Войти</button>
      </form>
    </div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
